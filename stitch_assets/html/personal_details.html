<!DOCTYPE html>

<style>
        body {
            background-color: #0A0A0A;
            color: #e5e2e1;
            -webkit-font-smoothing: antialiased;
        }

        .glass-card {
            background: rgba(22, 22, 22, 0.6);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:focus-within {
            border-color: #f5c400;
            background: rgba(245, 196, 0, 0.03);
            box-shadow: 0 0 20px rgba(245, 196, 0, 0.1);
        }

        .gold-glow {
            box-shadow: 0 10px 30px -5px rgba(245, 196, 0, 0.3);
        }

        /* Hide number input spinners */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top Navigation / Progress -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-container-margin py-md bg-background/80 backdrop-blur-xl border-b border-white/5">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
<span class="font-display-lg-mobile text-headline-md text-primary tracking-tighter">FitAI X</span>
</div>
<div class="flex flex-col items-end gap-xs">
<span class="font-label-caps text-label-caps text-on-surface-variant">Step 1 of 4</span>
<div class="w-24 h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary-container w-1/4 rounded-full"></div>
</div>
</div>
</header>
<!-- Background Atmospheric Effect -->
<div class="fixed inset-0 pointer-events-none z-0">
<div class="absolute top-[-10%] right-[-10%] w-[500px] h-[500px] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[400px] h-[400px] bg-on-primary-fixed-variant/5 blur-[100px] rounded-full"></div>
</div>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-container-margin pt-xxxl pb-xxl relative z-10 w-full max-w-2xl mx-auto">
<section class="w-full space-y-xl">
<!-- Headline Area -->
<div class="text-center space-y-sm">
<h1 class="font-display-lg-mobile text-display-lg-mobile text-on-surface tracking-tight">Personal Details</h1>
<p class="font-body-md text-on-surface-variant max-w-md mx-auto">Help us calibrate your AI model by providing your basic metrics for precision tracking.</p>
</div>
<!-- Bento Form Grid -->
<form class="grid grid-cols-2 gap-md w-full">
<!-- Gender Selection (Spans full width for premium feel) -->
<div class="col-span-2 glass-card rounded-xl p-lg flex flex-col gap-md">
<label class="font-label-caps text-label-caps text-on-surface-variant">Biological Gender</label>
<div class="grid grid-cols-2 gap-md">
<button class="gender-btn flex items-center justify-center gap-sm py-md rounded-lg bg-surface-container-low border border-white/5 text-on-surface-variant hover:border-primary/50 transition-all" onclick="selectGender(this)" type="button">
<span class="material-symbols-outlined">male</span>
<span class="font-body-lg">Male</span>
</button>
<button class="gender-btn flex items-center justify-center gap-sm py-md rounded-lg bg-surface-container-low border border-white/5 text-on-surface-variant hover:border-primary/50 transition-all" onclick="selectGender(this)" type="button">
<span class="material-symbols-outlined">female</span>
<span class="font-body-lg">Female</span>
</button>
</div>
</div>
<!-- Age Input -->
<div class="glass-card rounded-xl p-lg flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">calendar_today</span>
                        Age
                    </label>
<div class="flex items-baseline gap-xs">
<input class="bg-transparent border-none p-0 focus:ring-0 w-full font-data-lg text-display-lg-mobile text-primary placeholder:text-primary/20" placeholder="28" type="number"/>
<span class="font-data-sm text-on-surface-variant/40">yrs</span>
</div>
</div>
<!-- Weight Input -->
<div class="glass-card rounded-xl p-lg flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">scale</span>
                        Weight
                    </label>
<div class="flex items-baseline gap-xs">
<input class="bg-transparent border-none p-0 focus:ring-0 w-full font-data-lg text-display-lg-mobile text-primary placeholder:text-primary/20" placeholder="185" type="number"/>
<span class="font-data-sm text-on-surface-variant/40">lbs</span>
</div>
</div>
<!-- Height Input -->
<div class="col-span-2 glass-card rounded-xl p-lg flex flex-col gap-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant flex items-center gap-xs">
<span class="material-symbols-outlined text-[14px]">straighten</span>
                        Height
                    </label>
<div class="flex items-baseline gap-md">
<div class="flex items-baseline gap-xs flex-1 border-b border-white/10 pb-xs focus-within:border-primary transition-colors">
<input class="bg-transparent border-none p-0 focus:ring-0 w-full font-data-lg text-display-lg-mobile text-primary placeholder:text-primary/20" placeholder="6" type="number"/>
<span class="font-data-sm text-on-surface-variant/40">ft</span>
</div>
<div class="flex items-baseline gap-xs flex-1 border-b border-white/10 pb-xs focus-within:border-primary transition-colors">
<input class="bg-transparent border-none p-0 focus:ring-0 w-full font-data-lg text-display-lg-mobile text-primary placeholder:text-primary/20" placeholder="1" type="number"/>
<span class="font-data-sm text-on-surface-variant/40">in</span>
</div>
</div>
</div>
</form>
</section>
<!-- CTA Area -->
<footer class="w-full mt-xxl">
<button class="w-full py-lg bg-primary-container text-on-primary-container font-headline-md rounded-full gold-glow hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-md group">
<span>Continue</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
<p class="text-center mt-md font-label-caps text-on-surface-variant/40 uppercase tracking-widest">Step 1: Bio-Metrics Encryption</p>
</footer>
</main>
<!-- Bottom Spacing for mobile UI safety -->
<div class="h-8"></div>
<script>
        function selectGender(btn) {
            // Remove active classes from all gender buttons
            document.querySelectorAll('.gender-btn').forEach(b => {
                b.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary', 'shadow-lg');
                b.classList.add('bg-surface-container-low', 'text-on-surface-variant', 'border-white/5');
                // Reset icons
                b.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 0";
            });

            // Add active classes to selected button
            btn.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary', 'shadow-lg');
            btn.classList.remove('bg-surface-container-low', 'text-on-surface-variant', 'border-white/5');
            btn.querySelector('.material-symbols-outlined').style.fontVariationSettings = "'FILL' 1";
            
            // Add a little pop effect
            btn.classList.add('scale-105');
            setTimeout(() => btn.classList.remove('scale-105'), 150);
        }

        // Micro-interaction for inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.closest('.glass-card').style.borderColor = '#f5c400';
            });
            input.addEventListener('blur', () => {
                input.closest('.glass-card').style.borderColor = 'rgba(255, 255, 255, 0.08)';
            });
        });
    </script>
</body></html>
